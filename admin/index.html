<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Crayons First Studios</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-wrap { max-width: 1000px; margin: 40px auto; padding: 20px; background: #111; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 10px; text-align: left; }
    th { background: #222; color: var(--red); }
    .form-group { margin-bottom: 15px; }
    input, select, textarea { width: 100%; padding: 8px; background: #222; color: white; border: 1px solid #444; border-radius: 4px; }
    .btn { background: var(--red); color: white; border: none; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <img src="../images/logo.png" alt="Logo" class="logo">
      <nav>
        <a href="../index.html">← Back to Store</a>
      </nav>
    </div>
  </header>

  <div class="admin-wrap">
    <h1 style="color: var(--red);">Admin Panel</h1>
    <p>Manage products, rentals, bookings & marketplace listings.</p>

    <h2 style="margin-top: 30px;">Add / Edit Product</h2>
    <form id="product-form">
      <div class="form-group"><label>Title</label><input type="text" id="title" required></div>
      <div class="form-group"><label>Category</label>
        <select id="category">
          <option>Rentals</option>
          <option>Studio</option>
          <option>Marketplace</option>
          <option>E-store</option>
        </select>
      </div>
      <div class="form-group"><label>Price (₹)</label><input type="number" id="price" required></div>
      <div class="form-group"><label>Description</label><textarea id="desc" rows="3"></textarea></div>
      <button type="submit" class="btn">Save Product</button>
    </form>

    <h2 style="margin-top: 40px;">Current Products</h2>
    <table id="products-table">
      <thead><tr><th>Title</th><th>Category</th><th>Price</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let products = JSON.parse(localStorage.getItem('crayonsProducts')) || [
      {title: "Camera Rental Package", category: "Rentals", price: 5000},
      {title: "Studio Space - Full Day", category: "Studio", price: 18000},
      {title: "Official T-Shirt", category: "E-store", price: 899}
    ];

    function renderTable() {
      const tbody = document.querySelector('#products-table tbody');
      tbody.innerHTML = products.map((p, i) => `
        <tr>
          <td>${p.title}</td>
          <td>${p.category}</td>
          <td>₹${p.price}</td>
          <td><button onclick="deleteProduct(${i})" style="background:#c00;color:white;border:none;padding:5px 10px;cursor:pointer;">Delete</button></td>
        </tr>
      `).join('');
    }

    function deleteProduct(i) {
      products.splice(i, 1);
      localStorage.setItem('crayonsProducts', JSON.stringify(products));
      renderTable();
    }

    document.getElementById('product-form').addEventListener('submit', e => {
      e.preventDefault();
      const newP = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        price: Number(document.getElementById('price').value),
        desc: document.getElementById('desc').value
      };
      products.push(newP);
      localStorage.setItem('crayonsProducts', JSON.stringify(products));
      renderTable();
      e.target.reset();
      alert('Product saved!');
    });

    renderTable();
  </script>
</body>
</html>
